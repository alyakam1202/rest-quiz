<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rest Personality Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg1:#e9ecf8;--bg2:#f7e8ef;--ink:#2c2848;--soft:#6a6586;--card:rgba(255,255,255,.72);--line:rgba(44,40,72,.12);--accent:#8b7fd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1b33;--bg2:#2b2040;--ink:#f1eefc;--soft:#b3adcf;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--accent:#b3a8f0}}
:root[data-theme="dark"]{--bg1:#1d1b33;--bg2:#2b2040;--ink:#f1eefc;--soft:#b3adcf;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--accent:#b3a8f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55;position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;pointer-events:none}
.b1{width:260px;height:260px;background:#a79bd6;top:-70px;left:-80px}
.b2{width:240px;height:240px;background:#8db69a;bottom:-60px;right:-70px}
.b3{width:180px;height:180px;background:#e8a5b3;top:45%;right:-60px}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:2.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sub{color:var(--soft);margin:12px 0 22px}
button{font:inherit;cursor:pointer;color:inherit}
.go{background:var(--ink);color:var(--bg1);border:0;border-radius:999px;padding:13px 28px;font-weight:700}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .35s}
.q{font-size:1.45rem;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;transition:transform .15s,border-color .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
.count{color:var(--soft);font-size:.9rem;margin-bottom:6px}
.dot{width:64px;height:64px;border-radius:50%;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
.row span:first-child{width:130px}
.row .t{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.row .t i{display:block;height:100%;border-radius:9px}
.box{border-radius:18px;padding:14px 16px;margin:12px 0;border:1px solid var(--line);background:var(--card)}
.box b{display:block;margin-bottom:2px}
.say{font-family:'Fraunces',Georgia,serif;font-size:1.1rem}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<section id="start" class="card">
<h1>Rest Personality Match</h1>
<p class="sub">Ten quick questions. Pick the answer that feels most like you, not the one you think you should choose. You'll get your rest style, a strategy that fits it, and a boundary script to borrow.</p>
<button class="go" id="begin">Start the quiz</button>
</section>
<section id="quiz" class="card hide">
<div class="bar"><i id="fill"></i></div>
<div class="count" id="count"></div>
<h2 class="q" id="q"></h2>
<div id="opts"></div>
</section>
<section id="result" class="card hide"></section>
</main>
<script>
var Q=[
["After a brutal exam, you most want to...",["Plan the week ahead so nothing feels chaotic","Get dinner with friends","Lie down somewhere quiet and dark","Go for a run, lift, or walk outside"]],
["Your ideal 20-minute break is...",["Checking things off a to-do list","Calling or texting someone","Headphones, no screens","Stepping outside and moving"]],
["When overwhelmed, you tend to...",["Make a list or schedule","Talk it out with someone","Go quiet and withdraw","Get restless and need to move"]],
["Your perfect Sunday is...",["Meal prep and planning the week","Brunch or game night","A slow morning, reading, a nap","A hike or workout"]],
["What gets in the way of your rest most?",["Guilt about unfinished tasks","Feeling like you're missing out","Too much noise and stimulation","Difficulty sitting still"]],
["The boundary you'd most likely set is...",["A hard stop time for studying","Protected plans with people you love","Phone-free hours","A daily movement break"]],
["Rest feels most guilt-free when...",["It's already on my calendar","I'm sharing it with someone","Nobody can reach me","I've moved my body first"]],
["You know you're running low when...",["Everything feels urgent and I can't prioritize","I feel isolated and crave company","Sounds and screens feel like too much","I feel tense, jittery, or wired"]],
["An unexpected free hour appears. You...",["Use it to plan or prep so tomorrow is easier","Text a friend to see who's around","Sit in silence and do nothing","Head outside"]],
["A classmate asks you to skip your off-day to study together. You say...",["\"I have that time blocked. Let's find another slot.\"","\"Let's study together, but I'm done by 6 for dinner plans.\"","\"I'm offline today. Text me tomorrow.\"","\"Come on a walk and we can quiz each other.\""]]
];
var T=[
{n:"The Scheduler",c:"#a79bd6",by:"Structure and predictability",s:"Put rest on the calendar like a lecture, with a start and end time.",b:"I'm done at 8 PM. I'll pick this up tomorrow.",p:"Rest can turn into another task. Leave one block unplanned each week."},
{n:"The Social Recharger",c:"#e8a5b3",by:"Connection",s:"Keep weekly standing plans with friends or family outside of medicine.",b:"I can't study tonight, I have plans I'm keeping.",p:"It's easy to overextend. Not every night needs to be social."},
{n:"The Sensory Reset",c:"#8cbde0",by:"Quiet and low stimulation",s:"Protect a daily screen-free window, even 15 minutes.",b:"I'm taking an hour offline. I'll reply after.",p:"Withdrawing can slide into isolating. Pair quiet time with one check-in a day."},
{n:"The Mover",c:"#8db69a",by:"Physical activity",s:"Walk or stretch between study blocks to reset your body and focus.",b:"I'm taking a movement break. Back in 20.",p:"Movers can skip true rest when exhausted or hurt. Schedule a full recovery day."}
];
var i=0,sc=[0,0,0,0];
function $(id){return document.getElementById(id)}
function show(id){["start","quiz","result"].forEach(function(x){$(x).classList.toggle("hide",x!==id)});window.scrollTo(0,0)}
function ask(){
 $("q").textContent=Q[i][0];
 $("count").textContent="Question "+(i+1)+" of "+Q.length;
 $("fill").style.width=(i/Q.length*100)+"%";
 var o=$("opts");o.innerHTML="";
 Q[i][1].forEach(function(t,k){
  var b=document.createElement("button");b.className="opt";b.textContent=t;
  b.onclick=function(){sc[k]++;i++;i<Q.length?ask():done()};
  o.appendChild(b);
 });
}
function done(){
 var m=Math.max.apply(null,sc),top=[];
 sc.forEach(function(v,k){if(v===m)top.push(k)});
 var h=top.length>1?"You're a blend":"You're "+T[top[0]].n;
 var x='<div class="dot" style="background:'+T[top[0]].c+'"></div><h2>'+h+'</h2>';
 if(top.length>1)x+='<p class="sub">'+top.map(function(k){return T[k].n}).join(" + ")+'. Use strategies from both.</p>';
 top.forEach(function(k){var t=T[k];
  x+='<div class="box"><b>'+t.n+'</b>Recharges by: '+t.by+'</div>'+
  '<div class="box"><b>Try this</b>'+t.s+'</div>'+
  '<div class="box"><b>Boundary script</b><span class="say">"'+t.b+'"</span></div>'+
  '<div class="box"><b>Watch out for</b>'+t.p+'</div>';
 });
 x+='<h2 style="font-size:1.2rem;margin:20px 0 6px">Your breakdown</h2>';
 T.forEach(function(t,k){x+='<div class="row"><span>'+t.n+'</span><span class="t"><i style="width:'+(sc[k]/Q.length*100)+'%;background:'+t.c+'"></i></span><span>'+sc[k]+'</span></div>'});
 x+='<p class="sub">Most people lean toward one style but use all four. Try a strategy from a type you scored low on this week.</p><button class="go" id="again">Retake</button>';
 $("result").innerHTML=x;show("result");
 $("again").onclick=function(){i=0;sc=[0,0,0,0];ask();show("quiz")};
}
$("begin").onclick=function(){i=0;sc=[0,0,0,0];ask();show("quiz")};
</script>
</body>
</html>
